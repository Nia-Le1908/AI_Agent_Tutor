name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented floor in README/SETUP_GUIDE, 3.11 is what the
        # project pins its venv to today; 3.12 guards against forward drift.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-ci.txt == requirements.txt minus sentence-transformers/torch
          # and psycopg2, none of which the hermetic suite needs.
          python -m pip install -r requirements-ci.txt

      - name: Verify every module imports
        run: |
          python - <<'PY'
          import importlib, pathlib, sys

          sys.path.insert(0, ".")
          failed = False
          for path in sorted(pathlib.Path(".").glob("*.py")):
              try:
                  importlib.import_module(path.stem)
              except Exception as exc:  # surface the real cause, then fail the job
                  failed = True
                  print(f"::error title=import failure::{path.name}: {type(exc).__name__}: {exc}")
          sys.exit(1 if failed else 0)
          PY

      - name: Run test suite
        run: python -m pytest

      - name: Smoke-test the CLI entry points
        run: |
          python init_db.py
          python generate_mock_data.py
          python -c "from db_manager import health_check; assert health_check(), 'health_check failed'"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-py${{ matrix.python-version }}
          path: |
            logs/
            mock_data/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff>=0.4,<0.7"

      # Focused on the regressions this codebase cares about: unused imports and
      # rebindings (the old duplicated-config bug class), undefined names, and
      # unused locals. Deliberately not a full reformat of the repo.
      - name: Ruff (pyflakes rules)
        run: python -m ruff check --select F --exclude .venv,mock_data .

      - name: Byte-compile all sources
        run: python -m compileall -q . -x "(\.venv|mock_data)/.*"
